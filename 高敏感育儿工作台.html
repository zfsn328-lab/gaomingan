<aside><div class="brand">♧ 高敏感育儿工作台</div><div class="small muted" style="padding-left:10px">给敏感孩子家庭的日常工具</div><button class="navToggle" type="button" aria-expanded="false" onclick="const a=document.querySelector('aside');a.classList.toggle('menu-open');this.setAttribute('aria-expanded',a.classList.contains('menu-open'));this.textContent=a.classList.contains('menu-open')?'收起导航 ▲':'☰ 查看全部栏目'">☰ 查看全部栏目</button><nav id="nav" onclick="if(event.target.closest('button')){const a=document.querySelector('aside');a.classList.remove('menu-open');const t=a.querySelector('.navToggle');t.textContent='☰ 查看全部栏目';t.setAttribute('aria-expanded','false')}"></nav><p class="small muted" style="padding:10px">3—8岁家庭 · 成人陪同使用<br>先连接，再一起找办法。</p></aside><main><div id="app"></div><div class="safety">本工具用于家庭观察与沟通，不是诊断、治疗或心理测评。“高敏感”不能解释所有困难。持续影响睡眠、进食、入园或上学时，请咨询儿科或合格儿童心理专业人员。填写时自动尝试保存到当前浏览器。换文件、换位置或换浏览器时，请先下载“含记录HTML”。请避免填写真实姓名等身份信息。</div></main><div id="toast" class="toast"></div><script id="family-saved-data" type="application/json">null</script><script>

const titles=['今天的工具台','行为理解词典','情绪观察日记','情绪应对包','情绪身体地图','困难事件三步复盘','放学后减压流程','父母焦虑三步练习','感官舒适清单','温和活动菜单','安静角落搭建','优势发现清单','成长故事库','使用说明与记录'];

const subtitles=['','把标签换成观察与可能的需要','记录发生了什么，而不急着判断','先保证安全，再减少刺激','让孩子说说，感受出现在身体哪里','等双方平静后，再一起回看','从学校节奏，慢慢回到家庭节奏','分清我的担心与孩子的经历','这里的“感官饮食”指感官体验，不是营养食谱','参考“前庭觉充电”，改为可自主停止的日常活动','一处可以选择进入，也能自由离开的地方','找到具体行为里的长处','从具体选择与支持条件中获得启发'];

const desc=['','怕吵、慢热、反复确认……换一种理解方式。','用事实、感受、回应和变化留下线索。','手边可用的陪伴步骤与回应句。','点选身体部位，记录孩子自己的描述。','事实 → 需要 → 下次的一小步。','少一点追问，留一点恢复空间。','看见担心，回到此刻能做的一件事。','声音、光线、触感与气味的偏好。','散步、伸展、慢踏步，让孩子自主选择。','选位置、定规则、准备舒服的小物。','用真实例子记录，不做天赋评分。','4个明确标注为虚构的成长情境。'];

let db,storageOK=true;const embeddedNode=document.getElementById('family-saved-data');let embeddedDB;try{embeddedDB=JSON.parse(embeddedNode?embeddedNode.textContent:'null')}catch{}try{db=JSON.parse(localStorage.getItem('little-tree-family-v2'))}catch{storageOK=false}if(embeddedDB&&(!db||(embeddedDB.updatedAt||0)>(db.updatedAt||0)))db=embeddedDB;db=db||{};db.records=db.records||[];db.drafts=db.drafts||{};db.checks=db.checks||{};let cur=0,parts=[],emotionStep=0;const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){db.updatedAt=Date.now();try{const payload=JSON.stringify(db);localStorage.setItem('little-tree-family-v2',payload);storageOK=localStorage.getItem('little-tree-family-v2')===payload}catch{storageOK=false}updateSaveStatus();return storageOK}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}function go(i){cur=i;parts=[];render();window.scrollTo(0,0)}function field(name,label,type='text',hint=''){let value=db.drafts[cur+':'+name]||'';return `<div class="field"><label for="${name}">${label}</label>${type==='textarea'?`<textarea id="${name}" data-field="${name}" placeholder="${esc(hint)}">${esc(value)}</textarea>`:`<input id="${name}" data-field="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(hint)}">`}</div>`}function check(group,items){return items.map((t,i)=>`<label class="check"><input type="checkbox" ${db.checks[group+':'+i]?'checked':''} onchange="db.checks['${group}:${i}']=this.checked;persist()"><span>${t}</span></label>`).join('')}function note(t){return `<div class="notice">${t}</div>`}function card(t,b){return `<div class="card"><h2>${t}</h2>${b}</div>`}function recordButton(label='保存这次记录'){return `<div class="actions"><button class="primary" onclick="record()">${label}</button><button onclick="window.print()">打印当前页</button></div>`}function history(type){let rows=db.records.filter(r=>r.type===type).slice().reverse();return `<h2 style="margin-top:24px">最近记录 · ${rows.length} 条</h2>`+(rows.slice(0,10).map(r=>`<div class="saved"><span class="small muted">${esc(r.time)}</span><p>${esc(r.text)}</p></div>`).join('')||'<p class="history-empty">还没有记录，先保存一次小观察。</p>')}

const dict=[['“太矫情” / 捂耳朵','声音可能过大，也可能疲倦或身体不适。','先离开声源，问“哪个声音让你难受？”','记录具体声音、距离和当时状态。'],['“太胆小” / 不肯参与','可能不熟悉流程、需要观察，也可能确实不喜欢。','允许旁观，告诉他可以怎样加入。','不要以突然推上台的方式“练胆”。'],['“故意磨蹭” / 不肯换活动','可能没弄清终点，或转换对他来说较困难。','提前预告，给一个清楚的最后步骤。','保留适龄要求，成人提供必要协助。'],['“爱顶嘴” / 反复问为什么','可能需要可预测性，也可能规则不清楚。','用短句说明原因，再说现在的一步。','不把所有抗拒都归因于敏感。'],['“玻璃心” / 被说后哭','可能失望、羞耻或担心关系受损。','先承认感受，平静后讨论行为。','接纳情绪与保留边界可以同时做到。'],['“太挑剔” / 拒绝衣物','可能是标签、接缝、温度或皮肤问题。','提供两件合适衣物选择，检查不适。','疼痛、皮疹或持续困扰应就医。'],['“不合群” / 独处','可能在恢复精力，也可能经历排斥。','问他是想独处，还是想参与却有困难。','涉及欺凌时成人需介入。'],['“完美主义” / 反复擦改','可能担心评价，也可能任务过难。','允许草稿，把任务缩成一小步。','持续焦虑和耗时需要进一步了解。']];

function render(){document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button class="${cur===i?'active':''}" onclick="go(${i})">${i===0?'◫':i===13?'ⓘ':String(i).padStart(2,'0')}　${t}</button>`).join('');let h=cur>0?`<span class="eyebrow">${cur===13?'YOUR FAMILY SPACE':'TOOL '+String(cur).padStart(2,'0')+' / 12'}</span><h1>${titles[cur]}</h1><p class="muted">${subtitles[cur]||'了解保存方式、备份与资料依据。'}</p>`:'';

if(cur===0)h=`<div class="hero"><div><span class="eyebrow">今天，从一个小小的支持开始</span><h1>理解孩子，也照顾自己。</h1><p>12件家庭工具，在需要的时候打开。</p><div class="actions"><button class="primary" onclick="go(3)">现在情绪很强烈 →</button><button onclick="go(2)">记一次观察</button></div></div><span class="leaf" style="font-size:90px;color:#829767">♧</span></div><div class="grid">${titles.slice(1,13).map((t,j)=>`<div class="card tool"><span class="num">${String(j+1).padStart(2,'0')} / FAMILY TOOL</span><h2>${t}</h2><p class="muted small">${desc[j+1]}</p><button onclick="go(${j+1})">打开工具　↗</button></div>`).join('')}</div>`;

if(cur===1)h+=`<input aria-label="搜索行为" placeholder="搜索：怕吵、穿衣、磨蹭……" oninput="filterDict(this.value)"><div id="dict" class="grid" style="margin-top:20px"></div>`+note('这些是待验证的理解方向，不能用行为推断诊断。先问、先观察，孩子可能有不同解释。');

if(cur===2)h+=`<div class="two">${card('今天发生了什么',field('date','观察日期','date')+field('context','场景与发生前的情况','textarea','例如：放学后商场很吵，午饭吃得少')+field('behavior','我实际看到、听到的行为','textarea','避免“故意”“矫情”等判断')+field('feeling','孩子说的感受与需要','textarea','不知道也可以写“不清楚”')+field('response','我做了什么，之后发生什么','textarea')+field('next','下次只调整一件事','textarea')+recordButton())}${card('怎么记，才更有用','<p class="quote">“捂住耳朵说太吵”，比“又闹脾气了”更具体。</p><p>一次只记录一个事件，不需要给孩子的敏感程度打分。</p><p>留意睡眠、饥饿、疼痛、生活变化和成人当时的回应。</p>'+history(2))}</div>`;

if(cur===3){const steps=[['先护住安全','远离车流、高处、锐物；成人平静地挡住打人或伤害自己的动作。不要把孩子独自锁起来。','“我会陪你，也会护住你和别人。”'],['减少刺激和语言','转到较安静安全处，减少围观、提问和指令。允许孩子保持距离，拥抱需要他愿意。','“这里太吵了，我们去旁边歇一下。”'],['提供一个可选择的支持','在成人陪同下选喝水、坐一会儿、看熟悉的图画或保持安静。无需强迫深呼吸。','“你想我坐旁边，还是留一点空间？”'],['平静后再回到小要求','孩子能回应后，再说一个简短要求。不要急着复盘或要求立刻道歉。','“刚才很难受。现在我们先把地上的东西放好。”']];h+=`<div class="two">${card('此刻只做一步',`<span class="pill">${emotionStep+1} / 4</span><h1>${steps[emotionStep][0]}</h1><p>${steps[emotionStep][1]}</p><div class="quote">${steps[emotionStep][2]}</div><div class="actions"><button onclick="emotionStep=Math.max(0,emotionStep-1);render()">上一步</button><button class="primary" onclick="emotionStep=Math.min(3,emotionStep+1);render()">下一步</button></div><button onclick="go(5)">平静了，去复盘 →</button>`)}${card('手边的陪伴包',check('kit',['安全的饮水杯','孩子熟悉且适龄的小物','一张“我需要休息”卡','约定好的安静位置','可联系的另一位照顾者'])+note('如有紧急自伤、伤人或身体危险，优先保护安全并联系当地急救。此工具不能替代危机处置。'))}</div>`}

if(cur===4)h+=`<div class="two">${card('点选孩子描述的位置',`<svg viewBox="0 0 240 320" class="bodymap" aria-label="身体轮廓示意"><g fill="#e7eddd" stroke="#7f9975" stroke-width="2"><circle cx="120" cy="43" r="29"/><path d="M90 80 Q120 70 150 80 L170 163 L153 170 L140 123 L145 207 L139 302 L117 302 L114 218 L104 302 L82 302 L88 205 L95 125 L77 172 L61 165Z"/></g><text x="120" y="135" text-anchor="middle" fill="#547357" font-size="13">感受没有标准答案</text></svg><div class="parts">${['头部','脸颊','喉咙','胸口','肚子','双手','双腿','全身'].map(t=>`<button class="${parts.includes(t)?'selected':''}" aria-pressed="${parts.includes(t)}" onclick="pickPart('${t}')">${t}</button>`).join('')}</div>`)}${card('听孩子怎么形容',field('bodyFeeling','身体感觉像什么？','textarea','热热的、紧紧的、像蝴蝶飞……')+field('bodyEmotion','可能是什么情绪？','text','担心、生气、开心，或还不知道')+field('bodyNeed','现在想要哪种帮助？','textarea')+recordButton()+note('不把胸口紧、肚子疼自动解释为情绪问题。突然、剧烈或反复身体不适需就医。')+history(4))}</div>`;

tring'))throw Error();if(!confirm('恢复将替换当前记录。已备份当前内容并继续吗？'))return;db={records:x.records,drafts:x.drafts||{},checks:x.checks||{}};persist();render();toast('记录已恢复')}catch{toast('备份文件格式不正确')}}render();

const sceneKnowledge=[{"id": 1, "title": "袜子、标签或衣物接缝不舒服", "category": "感官负担", "action": "检查衣物与皮肤，提供两件合适衣物选择，给换衣留时间。", "speech": "你指给我看哪里不舒服，我们选一件能穿的。", "later": "记录材质、标签、温度；持续疼痛或皮疹需就医。", "tools": [8, 2], "page": 45}, {"id": 2, "title": "剪指甲或洗头很抗拒", "category": "感官负担", "action": "告知下一步，在安全前提下允许暂停，避免强行按住完成。", "speech": "我们先做一小步。你不舒服就告诉我停。", "later": "平静时商量顺序和暂停信号，检查是否疼痛。", "tools": [8, 5], "page": 46}, {"id": 3, "title": "商场里捂耳朵、蹲下", "category": "感官负担", "action": "先到安全安静处，减少提问；陪伴距离和拥抱由孩子选择。", "speech": "声音让你不舒服吗？我们先离远一点。", "later": "观察声源、饥饿、疲倦等因素，不直接认定听觉疼痛。", "tools": [3, 8], "page": 47}, {"id": 4, "title": "只接受很少几种食物", "category": "感官负担", "action": "保留可接受的安全食物，可自愿看看或闻闻新食物，不强塞。", "speech": "先看一看也可以，今天不必马上尝。", "later": "食物范围很窄、吞咽或生长有疑问时咨询儿科，不只归因于敏感。", "tools": [8, 2], "page": 48}, {"id": 5, "title": "灯亮、人多时烦躁", "category": "感官负担", "action": "降低刺激，允许在成人陪同下短暂退出，检查基本需要。", "speech": "这里人很多，我们去旁边坐一会儿。", "later": "缩短下次停留，安排休息和离开方式。", "tools": [8, 10], "page": 49}, {"id": 6, "title": "闻到气味就捂鼻或反胃", "category": "感官负担", "action": "离开气味来源，通风；不再叠加香味遮盖。", "speech": "这个味道让你难受，我们换个地方。", "later": "持续反胃、呕吐或其他身体不适应就医。", "tools": [8, 2], "page": 50}, {"id": 7, "title": "心爱的玩具损坏", "category": "情绪强烈", "action": "先承认失落，不急着用买新的替代；护住破损尖锐部位。", "speech": "你很喜欢它，坏了会难过。我陪你。", "later": "孩子愿意后再决定修理、保存或告别。", "tools": [3, 5], "page": 51}, {"id": 8, "title": "游戏输了发火、掀东西", "category": "情绪强烈", "action": "暂停游戏，护住人和物；允许失望，明确不能伤人。", "speech": "输了很失望，我不会让你把东西砸向别人。", "later": "平静后练一句输后的话，调整游戏难度和时长。", "tools": [3, 4, 5], "page": 52}, {"id": 9, "title": "被评价后难过很久", "category": "情绪强烈", "action": "听清原话和场景，不立即断言评价真或假。", "speech": "那句话让你难过。你愿意说说当时怎么回事吗？", "later": "区分行为反馈与个人价值；反复受辱或欺凌需成人介入。", "tools": [2, 11], "page": 53}, {"id": 10, "title": "积木倒了、作品出错", "category": "情绪强烈", "action": "暂缓重做，提供休息或尝试一小步的选择。", "speech": "你想把它做好。现在想休息，还是先试一个地方？", "later": "示范草稿和修改，关注尝试，不要求把错误变成惊喜。", "tools": [5, 11], "page": 54}, {"id": 11, "title": "睡前反复说害怕", "category": "情绪强烈", "action": "用短句回应，保持熟悉的睡前顺序，不在此刻长篇追问。", "speech": "你担心的事 ": [8, 10], "page": 65}, {"id": 22, "title": "读到角色受伤就哭", "category": "担心与共情", "action": "允许停下、跳过或换书，不强迫看完以练胆。", "speech": "这段让你难受。你想停下，还是看看谁来帮助他？", "later": "选适龄内容，按孩子意愿讨论故事与现实的区别。", "tools": [3, 4], "page": 66}, {"id": 23, "title": "害怕机器声或提示音", "category": "担心与共情", "action": "设备开启前告知，允许远离；不能确定时不承诺数几下就停。", "speech": "我要开这个机器了，你想先去另一边吗？", "later": "记录声源与距离；耳痛或听力疑问应就医。", "tools": [8, 2], "page": 67}, {"id": 24, "title": "别人哭时跟着哭", "category": "担心与共情", "action": "承认孩子自己的感受，提供暂时离开和陪伴，不要求负责让别人开心。", "speech": "看到他哭，你也难过了。我们先照顾一下你。", "later": "平静后讨论关心别人和照顾自己可以同时做到。", "tools": [4, 7], "page": 68}, {"id": 25, "title": "还没尝试就说做不到", "category": "担心与共情", "action": "问具体难点，把任务缩到适龄的一步，允许暂停。", "speech": "哪一部分最难？我们先看看最小的一步。", "later": "记录真实尝试，别用比较或空泛保证代替支持。", "tools": [11, 5], "page": 69}, {"id": 26, "title": "家里添了宝宝后更依赖", "category": "亲子互动", "action": "提供稳定关注和适龄协助，不因当哥哥姐姐而取消照顾。", "speech": "你也需要我照顾，我们留一点只陪你的时间。", "later": "尿裤子、能力退步或其他新变化需了解身体和发展因素。", "tools": [2, 7], "page": 70}, {"id": 27, "title": "只接受一位照顾者", "category": "亲子互动", "action": "提前说明短暂离开，用能做到的约定建立交接，另一成人逐步参与。", "speech": "我去一下洗手间，回来会告诉你。你可以先和家人在这里等。", "later": "不偷偷消失、不保证依赖必然减少；持续影响生活时咨询专业人员。", "tools": [2, 5], "page": 71}, {"id": 28, "title": "犯错后躲起来不肯道歉", "category": "亲子互动", "action": "先降羞耻，明确行为后果；不当众羞辱，给修复的空间。", "speech": "这件事需要处理，但一次错误不等于你不好。我们先一起收拾。", "later": "平静后再讨论道歉、补救与下次做法，不取消责任。", "tools": [5, 11], "page": 72}, {"id": 29, "title": "越催促越不回应", "category": "亲子互动", "action": "成人先降低声音，一次说一个具体要求，确认孩子听懂。", "speech": "我刚才说得太急了。现在先把鞋穿上。", "later": "检查任务难度、时间安排和成人疲劳，不把所有原因都归给孩子。", "tools": [7, 5], "page": 73}, {"id": 30, "title": "被人当面说胆小", "category": "亲子互动", "action": "成人温和挡住标签，不要求孩子现场证明勇敢。", "speech": "他需要一点时间，我们让他按自己的节奏来。", "later": "私下听孩子感受，帮助表达边界，不制造新的固定标签。", "tools": [1, 11], "page": 74}, {"id": 31, "title": "关屏幕时情绪很大", "category": "情绪强烈", "action": "事前约定清楚终点，提前提醒；结束后接一项可行活动，保持安全边界。", "speech": "你还想看。约定的时间到了，我们先关掉，再选接下来做什么。", "later": "观察内容、时长和转换安排，不把屏幕称作治疗或止痛药。", "tools": [5, 2], "page": 75}, {"id": 32, "title": "放学后特别容易哭闹", "category": "情绪强烈", "action": "先问候、饮水加餐、休息，少追问；仍保留不伤人的要求。", "speech": "你今天可能很累。我们先歇一歇，想说的时候再说。", "later": "了解睡眠、饥饿、园内压力等多种可能，不认定一定是因家里安全。", "tools": [6, 2], "page": 76}, {"id": 33, "title": "家长吼完后又后悔", "category": "亲子互动", "action": "确认安全，成人暂停或请可靠成人接手，为吼叫承担责任。", "speech": "刚才我吼你了，这是我要改的。规则我们平静后再说。", "later": "拟一个下次的暂停动作；拥抱先询问，孩子不必马上原谅。", "tools": [7, 5], "page": 77}, {"id": 34, "title": "照顾者之间规则不一致", "category": "亲子互动", "action": "私下就一个具体情境协商，避免在孩子面前指责或争输赢。", "speech": "我们先统一一件能做到的事，试一周再看。", "later": "写清谁做什么、例外如何说明，不把冲突归咎于某一代人。", "tools": [5, 7], "page": 78}, {"id": 35, "title": "很久都无法入睡", "category": "情绪强烈", "action": "保持简短熟悉的睡前顺序，减少新刺激，不强迫“把一天说完”。", "speech": "现在先让身体休息，有想说的我们明天再聊。", "later": "长期入睡困难、打鼾或白天疲倦应咨询儿科，不直接认定是深度加工。", "tools": [2, 8], "page": 79}, {"id": 36, "title": "看诊、打针前很害怕", "category": "担心与共情", "action": "根据理解能力适时如实解释，和医护商量陪伴和缓解疼痛的办法。", "speech": "医生会告诉我们下一步。可能有不舒服，我会陪着你。", "later": "不承诺不会疼或三秒结束；准备时机按孩子情况与医护建议调整。", "tools": [3, 2], "page": 80}, {"id": 37, "title": "强烈情绪中打人、咬人或扔物", "category": "情绪强烈", "action": "先拉开安全距离、移走危险物品，平静挡住伤害；不以吼叫或惩罚压制。", "speech": "我不会让你伤害自己或别人，我们先到安全的位置。", "later": "平静后练停手、离开、求助等替代动作；反复严重伤害需专业支持，紧急危险联系急救。", "tools": [3, 5, 4], "page": 81}];

const oldRender=render;

let sceneQuery='',sceneCategory='全部',sceneSelected=null;

function sceneView(){

const categories=['全部',...new Set(sceneKnowledge.map(s=>s.category))];

app.innerHTML='<span class="eyebrow">SCENARIO LIBRARY · 37</span><h1>按场景找办法</h1><p class="muted">3—6岁情境优先参考 · 先保安全，再支持感受，之后回到边界与复盘。</p>'+note('参考用户提供的83页卡片，整理为37个场景的原创行动提示。分类帮助查找，不是病因解释或诊断；具体做法需按孩子情况调整。')+'<div class="two"><div><label for="sceneSearch">发生了什么？</label><input id="sceneSearch" placeholder="试试：打针、袜子、放学、游戏、奶奶" value="'+esc(sceneQuery)+'" oninput="sceneQuery=this.value;drawScenes()"></div><div><label for="sceneCategory">按主题筛选</label><select id="sceneCategory" onchange="sceneCategory=this.value;drawScenes()">'+categories.map(c=>'<option '+(c===sceneCategory?'selected':'')+'>'+c+'</option>').join('')+'</select></div></div><div id="sceneResults"></div><div id="sceneDetail"></div>';

drawScenes();if(sceneSelected)showScene(sceneSelected,false);

function drawScenes(){let list=sceneKnowledge.filter(s=>(sceneCategory==='全部'||s.category===sceneCategory)&&[s.title,s.category,s.action,s.speech,s.later,({1:'袜子穿衣衣服',23:'吸尘器吹风机搅拌机电梯',31:'手机电视平板关屏',34:'奶奶爷爷姥姥老人规则',36:'医院医生疫苗注射'})[s.id]||''].join(' ').includes(sceneQuery));document.getElementById('sceneResults').innerHTML='<p class="small muted">找到 '+list.length+' 个场景</p><div class="grid">'+list.map(s=>'<div class="card tool"><span class="num">SCENE '+String(s.id).padStart(2,'0')+' · '+s.category+'</span><h2>'+s.title+'</h2><p class="small muted">'+s.action+'</p><button onclick="showScene('+s.id+')">看当下怎么说 →</button></div>').join('')+'</div>'+(list.length?'':'<p>没有找到匹配内容。可以换一个具体行为词，或选择“全部”。</p>');}

function showScene(id,scroll=true){sceneSelected=id;let s=sceneKnowledge.find(x=>x.id===id);document.getElementById('sceneDetail').innerHTML='<div class="card" style="margin-top:25px"><span class="pill">'+s.category+' · 场景 '+s.id+'</span><h1>'+s.title+'</h1><div class="two"><div><h3>① 当下先做</h3><p>'+s.action+'</p><h3>② 可以这样说</h3><p class="quote">'+s.speech+'</p><h3>③ 平静后再做</h3><p>'+s.later+'</p></div><div><h3>接着用这些工具</h3><div class="actions">'+s.tools.map(t=>'<button onclick="go('+t+')">'+titles[t]+' →</button>').join('')+'</div><button class="primary" onclick="startSceneRecord('+id+')">带着这个场景记一次观察</button><p class="small muted">会在观察日记中预填场景；已有未空白草稿会保留。</p><button onclick="printScene()">打印这张场景卡</button><details><summary>参考位置与整理说明</summary><p class="small muted">用户提供《卡片合集-全部83张》PDF：场景提示第'+(s.id+7)+'页、对应话术第'+s.page+'页。这里采用重新组织的行动提示，未嵌入原卡图或照录整段话术。</p></details></div></div></div>';if(scroll)document.getElementById('sceneDetail').scrollIntoView({behavior:'smooth',block:'start'});}

function startSceneRecord(id){let s=sceneKnowledge.find(x=>x.id===id);if(!db.drafts['2:context'])db.drafts['2:context']='场景：'+s.title+'\n当时的时间、地点与发生前的情况：';if(!db.drafts['2:next'])db.drafts['2:next']='待尝试（按实际情况修改）：'+s.later;persist();go(2);toast('已打开观察日记，原有草稿已保留');}

render=function(){if(cur===14){sceneView()}else{oldRender();if(cur===0){const entry=document.createElement('div');entry.className='card';entry.style.marginBottom='22px';entry.innerHTML='<span class="pill">新增 · 37个日常场景 / 6类主题</span><h2 style="margin-top:12px">遇到具体困难，先从场景找办法</h2><p>袜子不舒服、入园分离、关屏幕、打针害怕……找到当下回应，再衔接观察和复盘。</p><button class="primary" onclick="go(14)">打开场景知识库 →</button>';app.insertBefore(entry,app.querySelector('.grid'));}else if(cur>=1&&cur<=12){let linked=sceneKnowledge.filter(s=>s.tools.includes(cur));if(linked.length){let block=document.createElement('div');block.className='card';block.style.marginTop='22px';block.innerHTML='<h2>和这个工具有关的场景</h2><div class="actions">'+linked.map(s=>'<button onclick="openLinkedScene('+s.id+')">'+s.title+'</button>').join('')+'</div>';app.appendChild(block)}}}

const nav=document.getElementById('nav');if(!nav.querySelector('[data-scenes]')){let b=document.createElement('button');b.dataset.scenes='1';b.className=cur===14?'active':'';b.textContent='⌕　37个场景找办法';b.onclick=()=>go(14);nav.insertBefore(b,nav.children[1]);}nav.querySelectorAll('button').forEach(b=>{if(cur===14&&!b.dataset.scenes)b.classList.remove('active')});};

function openLinkedScene(id){sceneSelected=id;sceneQuery='';sceneCategory='全部';go(14)}

</script><script>

if(cur===13){app.querySelector('h1').textContent='我的记录与备份';const manager=document.createElement('div');manager.className='card recordTools';manager.innerHTML='<h2>记录带着走</h2><p>'+db.records.length+' 条已存记录 · '+(storageOK?'当前浏览器可保存':'当前浏览器无法长期保存，请及时下载')+'</p><p class="small muted">同一浏览器内自动保留草稿。换手机、换浏览器或更换HTML文件前，请保存一份含记录HTML，打开下载的新文件继续使用。</p><div class="actions"><button class="primary" onclick="savePortableHTML()">保存含记录HTML ↓</button><button onclick="backup()">导出备份文件</button></div>';app.insertBefore(manager,app.children[3]||null);const recordsCard=[...app.querySelectorAll('.card')].find(e=>e.querySelector('h2')?.textContent.startsWith('全部记录'));if(recordsCard){recordsCard.innerHTML='<h2>全部记录 · '+db.records.length+' 条</h2>'+db.records.map((r,i)=>({r,i})).reverse().map(({r,i})=>'<div class="saved"><span class="pill">'+esc(titles[r.type])+'</span><p class="small muted">'+esc(r.time)+'</p><p>'+esc(r.text).replace(/\\n/g,'<br>')+'</p><div class="historyActions"><button onclick="copyRecord('+i+')">复制</button><button onclick="removeRecord('+i+')">删除</button></div></div>').join('')+(db.records.length?'':'<p class="muted">还没有记录。可以先选一个场景，或直接记一次观察。</p><button onclick="go(2)">写第一条观察</button>')}}
